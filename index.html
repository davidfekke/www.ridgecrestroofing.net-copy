<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RidgeCrest Roofing | Professional Roof Replacement & Repair</title>
    <meta
      name="description"
      content="RidgeCrest Roofing offers expert roof replacement, repair, and inspections. Serving Jacksonville and surrounding areas with a 24-hour turnaround and on-site project management."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="tailwind.css" rel="stylesheet" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://c.animaapp.com/mqq6fwidBfIC09/assets/ridgecrestroofinglogo.svg"
    />
  </head>
  <body>
    <form
      name="inspection-request"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="inspection-request" />
      <input type="text" name="name" />
      <input type="text" name="address" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
